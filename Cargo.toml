[package]
name = "gdguard"
version = "0.28.1"
edition = "2024"
description = "GDScript linting, reviewed fixes and formatting for CLI and AI-agent workflows"
license = "MIT"
repository = "https://github.com/quangtran6767/gdscript-linter"
readme = "README.md"
keywords = ["godot", "gdscript", "format", "lint"]
categories = ["command-line-utilities", "development-tools"]
default-run = "gdguard"
rust-version = "1.89"

[workspace]
members = [
  "gdextension",
]

[lints.clippy]
dbg_macro = "warn"
branches_sharing_code = "warn"
needless_pass_by_value = "warn"
unused_self = "warn"
# We don't allow unwraps in code (use except() instead to give reason), except
# in test modules/unit test code blocks.
unwrap_used = "warn"

# Performance-related lints: remind to pre-allocate vecs and warn about value
# clones
vec_init_then_push = "warn"

ptr_arg = "warn"

# Style-related lints
redundant_closure = "warn"
redundant_closure_for_method_calls = "warn"
needless_return = "warn"
match_same_arms = "warn"
single_match_else = "warn"
manual_strip = "warn"
cast_lossless = "warn"

# In our coding guidelines we favor plain loops over rust iterators and
# functional-style functions, these linter configs allow us to use more
# procedural code.
needless_range_loop = "allow"
manual_find = "allow"

manual_filter_map = "allow"
manual_flatten = "allow"
manual_try_fold = "allow"
# With rust-version >= 1.88, clippy suggests merging nested `if let` blocks into
# let-chains. Nested blocks are fine and often read better, and rewriting the
# formatter for this would only create merge noise with upstream.
collapsible_if = "allow"

[dependencies]
tree-sitter-gdscript  = { git = "https://github.com/PrestonKnopp/tree-sitter-gdscript.git", rev = "872e2e96905892c954da4101c74b884d0155f4d8" }
tree-sitter = "=0.27.0"
regex = "=1.12.3"
# Official editorconfig parser
ec4rs = "=1.2.0"
# Linter: config file (gdguard.toml), JSON output and glob matching for
# excludes and per-folder overrides.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = "=1.2.1"
globset = "=0.4.19"
ast-grep-core = "=0.51.1"
ast-grep-config = "=0.51.1"
# Linter: unified diffs for `lint --diff`.
similar = "=2.7.0"
# SM0: embedded JS rules (per worker, optional) and synchronous LSP transport.
rquickjs = { version = "=0.9.0", optional = true }
lsp-server = "=0.7.9"
lsp-types = "=0.97.0"

[dev-dependencies]
test_each_file = "=0.3.7"

[features]
default = ["gdscript", "js-rules"]
gdscript = []
js-rules = ["dep:rquickjs"]

[[bin]]
name = "gdguard"
path = "src/main.rs"

[[bin]]
name = "gdscript-formatter"
path = "src/legacy_main.rs"

[profile.release]
strip = true
lto = true

# For the profiler, we want optimizations but also debug symbols so we can see
# function names in the profiler UI.
[profile.profiling]
inherits = "release"
debug = true
strip = false
