name: Release

on:
  push:
    tags: ["*.*.*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, platform: linux-x86_64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, platform: linux-aarch64 }
          - { target: x86_64-apple-darwin, os: macos-latest, platform: macos-x86_64 }
          - { target: aarch64-apple-darwin, os: macos-latest, platform: macos-aarch64 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, platform: windows-x86_64 }
          - { target: aarch64-pc-windows-msvc, os: windows-latest, platform: windows-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.platform == 'linux-aarch64'
        run: cargo install cross --version 0.2.5 --locked
      - name: Build CLI, alias and native library
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "linux-aarch64" ]]; then
            cross build --locked --release --workspace --lib --bin gdguard --bin gdscript-formatter --target ${{ matrix.target }}
          else
            cargo build --locked --release --workspace --lib --bin gdguard --bin gdscript-formatter --target ${{ matrix.target }}
          fi
      - name: Package platform archives
        run: python .github/package_release.py --platform ${{ matrix.platform }} --binary-dir target/${{ matrix.target }}/release --only cli native --output artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: gdguard-${{ matrix.platform }}
          path: artifacts/*.zip
          if-no-files-found: error

  package-common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify tag matches Cargo version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c 'import os,tomllib; assert os.environ["RELEASE_TAG"] == tomllib.load(open("Cargo.toml", "rb"))["package"]["version"], "tag and Cargo version differ"'
      - name: Package addon, types and examples
        run: python .github/package_release.py --only common --output artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: gdguard-common
          path: artifacts/*.zip
          if-no-files-found: error

  publish-release:
    needs: [build-binaries, package-common]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - run: python .github/generate_release_notes.py > release-notes.md
      - name: Create release draft for review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/*.zip --verify-tag --draft --title "gdguard $RELEASE_TAG" --notes-file release-notes.md
