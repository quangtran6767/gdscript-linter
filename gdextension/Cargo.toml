[package]
name = "gdguard-gdextension"
version = "0.22.3"
edition = "2024"
description = "Optional native gdguard lint and format API"
license = "MIT"
repository = "https://github.com/quangtran6767/gdscript-linter"
readme = "README.md"
keywords = ["godot", "gdscript", "format", "lint"]
categories = ["development-tools"]
rust-version = "1.94"

[lib]
name = "gdguard_gdextension"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
gdguard = { path = "../" }
godot = "=0.5.4"
